[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "doc-motion"
version = "0.1.0"
description = "A ConvNet that tells a phone document scanner whether the page in view is moving or still"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Siyuan David Zhu" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "keras>=3.6",
]
keywords = ["computer vision", "cnn", "image classification", "keras", "pytorch", "jax"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]

[project.optional-dependencies]
tensorflow = [
    "tensorflow-cpu>=2.16; sys_platform == 'linux'",
    "tensorflow>=2.16; sys_platform != 'linux'",
]
jax = ["jax[cpu]>=0.4.30"]
torch = ["torch>=2.2"]
dev = [
    "pytest>=8.0",
    "ruff==0.17.2",
    "mypy==2.4.0",
    "types-PyYAML>=6.0",
    "build>=1.0",
]

[project.scripts]
doc-motion = "doc_motion.cli:main"

[project.urls]
Homepage = "https://github.com/Siyuan-Zhu/computer-vision-document-motion-convnet"
Source = "https://github.com/Siyuan-Zhu/computer-vision-document-motion-convnet"
Issues = "https://github.com/Siyuan-Zhu/computer-vision-document-motion-convnet/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_motion"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "configs", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["cv2.*", "keras.*", "sklearn.*", "torch.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM", "RUF"]
